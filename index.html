<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SM Xanh - Theo dõi thu nhập</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f4f6f9;
    margin:0;
    padding:15px;
}

.container{
    max-width:700px;
    margin:auto;
}

.card{
    background:white;
    border-radius:12px;
    padding:15px;
    margin-bottom:15px;
    box-shadow:0 2px 8px rgba(0,0,0,0.08);
}

h1{
    text-align:center;
}

input{
    width:100%;
    padding:10px;
    margin-top:5px;
    margin-bottom:10px;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    background:#16a34a;
    color:white;
    font-size:16px;
}

table{
    width:100%;
    border-collapse:collapse;
    font-size:14px;
}

th,td{
    border:1px solid #ddd;
    padding:8px;
    text-align:center;
}

th{
    background:#16a34a;
    color:white;
}

.summary{
    font-size:16px;
    line-height:1.8;
}
</style>
</head>

<body>

<div class="container">

<div class="card">
<h1>SM Xanh</h1>

<label>Ngày</label>
<input type="date" id="ngay">

<label>Thu nhập ròng</label>
<input type="number" id="thuNhap">

<label>Số dư đầu kỳ</label>
<input type="number" id="dauKy">

<label>Số dư cuối kỳ</label>
<input type="number" id="cuoiKy">

<button onclick="themDuLieu()">Lưu dữ liệu</button>
<div class="card summary">
<b>Tổng thu nhập ròng:</b> <span id="tongThuNhap">0</span><br>
<b>Tổng tiền App:</b> <span id="tongApp">0</span><br>
<b>Tổng tiền Mặt:</b> <span id="tongMat">0</span>
</div>

<div class="card">
<table>
<thead>
<tr>
<th>Ngày</th>
<th>Thu nhập ròng</th>
<th>Tiền App</th>
<th>Tiền Mặt</th>
</tr>
</thead>
<tbody id="bangDuLieu"></tbody>
</table>
</div>

</div>

<script>

let duLieu = JSON.parse(localStorage.getItem("smxanh")) || [];

function dinhDang(n){
    return Number(n).toLocaleString("vi-VN");
}

function hienThi(){

    let html = "";

    let tongThuNhap = 0;
    let tongApp = 0;
    let tongMat = 0;

    duLieu.forEach(item=>{

        tongThuNhap += item.thuNhap;
        tongApp += item.app;
        tongMat += item.mat;

        html += `
        <tr>
            <td>${item.ngay}</td>
            <td>${dinhDang(item.thuNhap)}</td>
            <td>${dinhDang(item.app)}</td>
            <td>${dinhDang(item.mat)}</td>
        </tr>`;
    });

    document.getElementById("bangDuLieu").innerHTML = html;

    document.getElementById("tongThuNhap").innerText = dinhDang(tongThuNhap);
    document.getElementById("tongApp").innerText = dinhDang(tongApp);
    document.getElementById("tongMat").innerText = dinhDang(tongMat);
}

function themDuLieu(){

    const ngay = document.getElementById("ngay").value;

    const thuNhap = Number(document.getElementById("thuNhap").value);

    const dauKy = Number(document.getElementById("dauKy").value);

    const cuoiKy = Number(document.getElementById("cuoiKy").value);

    const app = cuoiKy - dauKy;

    const mat = thuNhap - app;
    

    duLieu.push({
        ngay,
        thuNhap,
        app,
        mat
    });

    localStorage.setItem("smxanh", JSON.stringify(duLieu));

    document.getElementById("dauKy").value = cuoiKy;
    document.getElementById("cuoiKy").value = "";
    document.getElementById("thuNhap").value = "";

    hienThi();
}

hienThi();

</script>

</body>
</html>
